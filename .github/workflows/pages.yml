name: Publish app
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', 'align.py', 'convert_mp4.py', '.github/workflows/pages.yml', '.github/workflows/test.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/test.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Version the Service Worker for this deployment
        run: sed -i "s/mv-studio-v3.5.2/mv-studio-${GITHUB_SHA}/" app/sw.js
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: app
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
        id: deploy
