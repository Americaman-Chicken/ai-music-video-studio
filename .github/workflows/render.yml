name: Render MV
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require private repository
        if: ${{ !github.event.repository.private }}
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          if python -c "import json; assert json.load(open('public/project.json'))['timing']=='auto'"; then
            pip install faster-whisper==1.1.1
            python align.py
          fi
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Video
          path: out/
          retention-days: 1
