name: Regression tests
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node tests/core.test.cjs && python -m unittest discover -s tests
      - run: pip install playwright pillow
      - name: Select Chromium for the browser tests
        timeout-minutes: 2
        run: |
          if chrome=$(command -v google-chrome || command -v chromium); then
            printf 'CHROMIUM_PATH=%s\n' "$chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Ensure FFmpeg and ffprobe are available
        timeout-minutes: 2
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=12 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=12 install -y ffmpeg
          fi
      - run: python tests/browser_smoke.py
