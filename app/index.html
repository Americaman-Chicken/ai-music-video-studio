<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Music Video Studio</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#101018"><style>*{box-sizing:border-box}body{margin:auto;max-width:760px;padding:24px;background:#101018;color:#eee;font:16px system-ui}h1{font-size:30px;letter-spacing:2px}small,p{color:#aaa}section{background:#1d1d29;border:1px solid #363648;border-radius:15px;padding:18px;margin:15px 0}label{display:block;margin:13px 0 5px}input,textarea,select,button{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#11111b;color:white}button{background:#d61576;font-weight:bold;border:0;margin-top:12px}button:disabled{opacity:.5}canvas{width:100%;border-radius:8px}audio{width:100%}a{color:#74deff}#status{white-space:pre-wrap}</style><h1>AI MUSIC VIDEO STUDIO</h1><p id="version">Version 3.1</p><button id="install" hidden>アプリをインストール</button><button id="update">更新を確認</button><p>音楽・歌詞・イラストから端末内でMVを制作。素材は自動送信されません。</p><section><label>曲名</label><input id="title" placeholder="曲名"><label>楽曲 MP3 / WAV / M4A</label><input id="audio" type="file" accept="audio/*"><label>イラスト（複数選択可）</label><input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple><label>歌詞</label><textarea id="lyrics" rows="7" placeholder="[00:12.50] 歌詞の一行目&#10;[00:16.00] 歌詞の二行目"></textarea><label>歌詞タイミング</label><select id="timing"><option value="auto">AI歌詞同期（別途Whisper処理）</option><option value="manual">時刻指定 [分:秒]</option><option value="even">均等配置（仮同期）</option></select><label>スタイル</label><select id="style"><option value="glitch">グリッチ・ボカロ</option><option value="dark">ダークロック</option><option value="summer">青春・夏</option><option value="minimal">ミニマル</option></select><label>BPM</label><input id="bpm" type="number" min="30" max="300" value="120"><button id="detect">楽曲からBPMを推定</button><div id="bpmstatus"></div><label>演出強度</label><input id="intensity" type="range" min="0" max="100" value="60"><label>演出指示（端末内ルール解析・生成AIではありません）</label><textarea id="notes" rows="3" placeholder="白黒、フェード
10-20秒: 画像2 ズームイン
サビ: 揺れ"></textarea></section><section><label>映像比率</label><select id="ratio"><option value="landscape">横 16:9</option><option value="portrait">縦 9:16</option></select><label>出力解像度</label><select id="resolution"><option value="480">480p（軽量）</option><option value="720" selected>720p</option><option value="1080">1080p</option></select><label><input type="checkbox" id="karaoke" style="width:auto"> カラオケ風の行内進行（推定）</label><label><input type="checkbox" id="spectrum" style="width:auto"> 音量連動ビジュアライザー</label><p id="mediaInfo"></p><button id="analyze">BPM・拍・反復構造を解析</button><pre id="sections" style="white-space:pre-wrap"></pre><div id="sectionEditor"></div><button id="makePlan">演出プランを作成・更新</button><textarea id="sceneJson" rows="6" aria-label="区間演出プランJSON"></textarea><button id="applyPlan">区間演出を適用</button></section><section><canvas id="preview" width="640" height="360"></canvas><audio id="player" controls></audio><p>端末出力と共通のプレビュー（AI同期はクラウド処理後にLRCを読み込み）</p><div id="timeline"></div><button id="refreshTimeline">歌詞タイムラインを更新</button><button id="stamp">現在の再生位置を歌詞欄に追加</button></section><section><button id="tapSync">再生中に次の歌詞を同期</button><label>AI同期済みLRC読み込み</label><input type="file" id="importLrc" accept=".lrc,.txt"><label>文字同期JSON（Whisper処理結果）</label><input type="file" id="importAlignment" accept=".json"><label>出力区間（秒、空欄で全曲）</label><input id="rangeStart" type="number" min="0" step="0.1" placeholder="開始"><input id="rangeEnd" type="number" min="0" step="0.1" placeholder="終了"><button id="saveProject">端末にプロジェクト保存</button><button id="restoreProject">保存済みプロジェクトを開く</button><button id="clearProject">保存データを削除</button><button id="renderLocal">端末内で動画を書き出す</button><button id="cancelRender" disabled>出力中止</button><p>対応端末ではMP4、非対応の場合はWebM。曲と同じ程度の処理時間が必要です。画面を閉じないでください。</p><p id="localStatus" role="status"></p></section><section><button id="export">制作素材ZIPを保存</button><p>外部処理が必要な場合のみ、信頼できる非公開環境で素材ZIPを利用してください。公開リポジトリへの素材登録は禁止です。</p><div id="status"></div></section><script>
const $=id=>document.getElementById(id);
// Store-only ZIP: no third-party browser scripts or network upload.
const enc=new TextEncoder(),table=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=(n&1)?0xedb88320^(n>>>1):n>>>1;return n>>>0});function crc(a){let c=0xffffffff;for(const b of a)c=table[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}function zip(entries){let parts=[],central=[],offset=0,total=0;for(const [name,a] of entries){const n=enc.encode(name),c=crc(a),h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,c,true);v.setUint32(18,a.length,true);v.setUint32(22,a.length,true);v.setUint16(26,n.length,true);h.set(n,30);parts.push(h,a);const b=new Uint8Array(46+n.length),w=new DataView(b.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint32(16,c,true);w.setUint32(20,a.length,true);w.setUint32(24,a.length,true);w.setUint16(28,n.length,true);w.setUint32(42,offset,true);b.set(n,46);central.push(b);offset+=h.length+a.length;total+=b.length}const e=new Uint8Array(22),v=new DataView(e.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,total,true);v.setUint32(16,offset,true);return new Blob([...parts,...central,e],{type:'application/zip'})}
let installEvent;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;$('install').hidden=false});$('install').onclick=async()=>{if(installEvent){await installEvent.prompt();installEvent=null;$('install').hidden=true}};
let registration;if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('./sw.js').then(r=>{registration=r;r.update().catch(()=>{});}).catch(e=>$('version').textContent+=' / offline unavailable');navigator.serviceWorker.addEventListener('controllerchange',()=>{$('version').textContent='更新済み：素材を保存してから再読み込みしてください'});}
$('update').onclick=async()=>{try{if(!registration)throw Error('HTTPSで公開後に利用できます');await registration.update();$('version').textContent=registration.waiting?'更新あり：素材を保存し、アプリを閉じて再起動してください':'更新確認完了（新バージョンは次回起動時に反映）'}catch(e){$('version').textContent=e.message}};
</script><script src="core.js"></script><script src="studio.js"></script></html>
